<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Nebula Drops: Fusion Core - CrazyGames</title>
    <meta
      name="description"
      content="Nebula Drops: Fusion Core - Physics puzzle game set in an abandoned orbital station. Drop and merge unstable liquid plasma cores before reactor meltdown!"
    />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <!-- Google Fonts: Montserrat & Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CrazyGames SDK v3 Official Script -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script>
      window.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });
      window.addEventListener("keydown", function (e) {
        const blockedKeys = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
        if (blockedKeys.indexOf(e.code) > -1) e.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div id="game-stage">
        <canvas id="game-canvas"></canvas>
      </div>
    </div>

    <!-- Main Game Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
